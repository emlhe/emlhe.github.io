- name: Paediatric stroke lesion segmentation
  icon: img_proj_2.png
  description: The aim of this project is to accurately segment stroke lesions from a paediatric dataset transferring knowledge from publicly available adult data using recent deep learning methods
  link: https://ieeexplore.ieee.org/document/10635273